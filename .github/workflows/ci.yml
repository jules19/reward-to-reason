name: course-ci

on:
  push:
  pull_request:

jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the full examiner against the reference solutions
        run: R2R_SOLUTIONS=1 pytest tests/ -q
        env:
          PYTHONHASHSEED: "0"
