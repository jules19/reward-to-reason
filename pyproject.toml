[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reward2reason"
version = "1.0.0"
description = "Reward2Reason: build a game engine that teaches itself, starting from a single bit of reward."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["r2r*"]
